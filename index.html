<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>لمّة – ألعاب</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<style>
:root{--bg:#1d1b3a;--bg2:#2c2a58;--acc:#f2b84b;--card:#fbf6f1;--ink:#2b1a28;--mute:#7a6a76;--line:#e6d9d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#2a2540;--ink:#f4ecf3;--mute:#bfb3c4;--line:#483f66}}
:root[data-theme="dark"]{--card:#2a2540;--ink:#f4ecf3;--mute:#bfb3c4;--line:#483f66}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{min-height:100dvh;background:radial-gradient(1000px 560px at 85% -10%,var(--bg2),var(--bg)) fixed,var(--bg);color:#fff;font-family:Tajawal,Tahoma,sans-serif;line-height:1.7;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
@media (min-width:768px){.wrap{max-width:860px;padding-top:34px}.grid{grid-template-columns:repeat(3,1fr)!important}.q{font-size:28px!important}}
h2{font-family:'Aref Ruqaa',serif;margin:0;font-size:26px}
.logo{font-family:'Aref Ruqaa',serif;font-size:58px;text-align:center;color:var(--acc);margin-top:34px}
.sub{text-align:center;color:#ffffffcc;margin:2px 0 20px}
.panel{background:var(--card);color:var(--ink);border-radius:22px;padding:22px}
input{width:100%;font:inherit;font-size:21px;text-align:center;letter-spacing:3px;padding:14px;border:2px solid var(--line);border-radius:14px;background:transparent;color:var(--ink);direction:ltr;text-transform:uppercase}
input.pl{direction:rtl;letter-spacing:0;text-transform:none;font-size:16px;color:#fff;border-color:#ffffff40;margin-bottom:16px;padding:10px}
input:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{font:inherit;font-weight:800;border:0;border-radius:15px;padding:13px 18px;min-height:50px;background:var(--acc);color:#1a1020;cursor:pointer;width:100%;margin-top:12px;font-size:18px;transition:transform .12s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.6}
.btn.alt{background:transparent;color:#fff;border:2px solid #ffffff55}
.err{color:#c62828;min-height:26px;margin:8px 0 0;text-align:center;font-weight:700}
.hint{color:#ffffffb0;font-size:14px;text-align:center;margin:12px 0 6px;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{font:inherit;text-align:right;background:var(--card);color:var(--ink);border:0;border-radius:20px 20px 4px 20px;padding:16px;cursor:pointer;min-height:140px;transition:transform .15s}
.game:nth-child(even){border-radius:20px 4px 20px 20px}.game:active{transform:scale(.96)}
.game span{font-size:34px;display:block}
.game b{display:block;font-family:'Aref Ruqaa',serif;font-size:22px;color:var(--bg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .game b{color:var(--acc)}}
.game small{color:var(--mute);font-size:13px;line-height:1.5;display:block}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.link{background:none;border:0;color:#fff;font:inherit;font-weight:700;cursor:pointer;padding:8px}
.badge{background:#ffffff22;border-radius:20px;padding:3px 12px;font-size:13px}
.turn{text-align:center;color:var(--acc);font-size:20px;font-weight:800;margin:4px 0 12px;min-height:34px}
.q{min-height:250px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:24px;line-height:1.9;font-weight:500;animation:flip .45s}
.q i{font-style:normal;font-size:46px}.tag{font-size:14px;color:var(--mute)}
.two{display:flex;gap:10px}
.count{text-align:center;color:#ffffffb0;font-size:14px;margin-top:10px}
.hide{display:none}
.wheel{position:relative;width:min(84vw,340px);margin:14px auto}
.wheel canvas{width:100%;display:block;border-radius:50%;box-shadow:0 0 0 6px var(--acc),0 10px 40px #0006;transition:transform 4s cubic-bezier(.12,.7,.1,1)}
.ptr{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:32px;z-index:2}
.bomb{font-size:120px;line-height:1}.tick{animation:pulse .55s infinite}
.big{font-size:70px;font-weight:800;color:var(--bg);line-height:1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .big{color:var(--acc)}}
.bar{height:10px;background:#ffffff25;border-radius:9px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:var(--acc);transition:width 30s linear}
@keyframes flip{from{transform:rotateY(80deg) scale(.92);opacity:0}}
@keyframes pulse{50%{transform:scale(1.14) rotate(-4deg)}}
@media (prefers-reduced-motion:reduce){.q,.tick{animation:none}.wheel canvas{transition-duration:.01s}}

/* Lamma UI refresh — responsive, accessible and touch friendly */
:root{--radius:24px;--shadow:0 18px 50px rgba(8,7,30,.24)}
html{scroll-behavior:smooth}
body{background:radial-gradient(700px 450px at 5% 5%,color-mix(in srgb,var(--bg2),transparent 25%),transparent),radial-gradient(550px 500px at 100% 90%,color-mix(in srgb,var(--acc),transparent 91%),transparent),linear-gradient(145deg,var(--bg),var(--bg2));background-attachment:fixed}
.wrap{position:relative;padding-bottom:max(42px,env(safe-area-inset-bottom));}
.logo{letter-spacing:-1.5px;text-shadow:0 7px 32px #0003;line-height:1.45}
.sub{font-size:15px;max-width:440px;margin:0 auto 25px}
.panel{border:1px solid color-mix(in srgb,var(--line),transparent 15%);box-shadow:var(--shadow);border-radius:var(--radius);backdrop-filter:blur(14px)}
.btn{position:relative;overflow:hidden;box-shadow:0 7px 20px color-mix(in srgb,var(--acc),transparent 77%);border-radius:16px;transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;letter-spacing:0}
.btn:not(:disabled):hover{transform:translateY(-2px);filter:brightness(1.06);box-shadow:0 12px 24px color-mix(in srgb,var(--acc),transparent 67%)}
.btn.alt{box-shadow:none}
.btn.alt:hover{background:#ffffff14}
input{outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc),transparent 80%)}
.grid{gap:14px}
.game{position:relative;overflow:hidden;min-height:164px;padding:19px;border:1px solid color-mix(in srgb,var(--line),transparent 24%);border-radius:22px!important;box-shadow:0 12px 28px #08051d20;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.game::after{content:"";position:absolute;width:100px;height:100px;left:-35px;top:-38px;border-radius:50%;background:color-mix(in srgb,var(--acc),transparent 89%);pointer-events:none}
.game:hover{transform:translateY(-4px);box-shadow:0 18px 32px #08051d32;border-color:var(--acc)}
.game span{display:flex;align-items:center;justify-content:center;width:53px;height:53px;margin-bottom:12px;border-radius:16px;background:color-mix(in srgb,var(--acc),transparent 82%);color:var(--bg)}
.game span .lucide{width:28px;height:28px;stroke-width:2.1}
.game b{font-family:Tajawal,Tahoma,sans-serif;font-weight:800;font-size:20px;line-height:1.5}
.game small{margin-top:4px;font-size:13px}
.top{gap:10px;flex-wrap:wrap}
.link{border:1px solid #ffffff3b;border-radius:12px;padding:8px 14px;background:#ffffff0c}
.badge{border:1px solid #ffffff29;padding:7px 13px;background:#ffffff15}
.turn{background:#ffffff0e;border:1px solid #ffffff19;border-radius:16px;padding:8px 12px}
.q{min-height:235px;gap:8px}
.two>.btn{flex:1;min-width:0}
.count{line-height:1.9}
@media(max-width:380px){.wrap{padding-inline:12px}.grid{gap:9px}.game{padding:13px;min-height:153px}.game b{font-size:17px}.game small{font-size:12px}.panel{padding:17px}}
@media(min-width:768px){.wrap{max-width:900px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.game{min-height:184px}}
@media(hover:none){.game:hover,.btn:hover{transform:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.game,.btn{transition:none}}


/* Welcome screen v2: unmistakable visual redesign */
.welcome-hero{text-align:center;position:relative;padding:30px 14px 15px;margin:16px auto 12px;border-radius:32px;background:radial-gradient(ellipse at 50% 10%,#f2b84b24,transparent 70%);border:1px solid #ffffff19}
.welcome-mark{height:76px;width:76px;display:grid;place-items:center;margin:0 auto 10px;border-radius:25px;background:linear-gradient(145deg,#fbe0a1,#f2b84b);box-shadow:0 12px 40px #f2b84b45;transform:rotate(-8deg);color:#251c43}
.welcome-mark svg{width:38px;height:38px;transform:rotate(8deg)}
.welcome-kicker{display:inline-block;border-radius:50px;padding:3px 15px;background:#ffffff15;border:1px solid #ffffff2d;font-size:13px;color:#ffe6a8;font-weight:700}
.welcome-hero .logo{font-size:clamp(72px,17vw,108px);margin:0;color:#ffcd70;line-height:1.3;text-shadow:0 8px 35px #f2b84b44}
.welcome-hero .sub{font-size:16px;max-width:310px;color:#f6eaf5;margin:0 auto 18px}
.welcome-pills{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
.welcome-pills span{display:inline-flex;align-items:center;gap:7px;background:#ffffff12;border:1px solid #ffffff2b;border-radius:50px;padding:7px 12px;font-size:12px;color:#fff}
.welcome-pills svg{width:16px;height:16px;color:#ffcf7e}
.welcome-panel{max-width:480px;margin:0 auto;background:linear-gradient(145deg,#fffdf9,#f7eee7);color:#271d3d;padding:25px;box-shadow:0 24px 60px #09061e60}
.panel-heading{display:flex;align-items:center;gap:13px;text-align:right;margin-bottom:18px}
.panel-heading>svg{width:42px;height:42px;padding:10px;border-radius:14px;background:#f9e7bf;color:#75501e}
.panel-heading strong,.panel-heading small{display:block}
.panel-heading strong{font-size:20px;font-weight:800}
.panel-heading small{font-size:13px;color:#746b7b}
.welcome-panel input{background:white;border:2px solid #e9ddcd;color:#241a38;font-weight:800;letter-spacing:3px}
.welcome-panel .btn{display:flex;justify-content:center;align-items:center;gap:10px;background:linear-gradient(110deg,#f2b84b,#ffda83);font-weight:800}
.welcome-panel .btn svg{width:20px;height:20px}
.welcome-panel .err{font-size:13px}
@media(min-width:768px){.welcome-hero{max-width:600px;margin-top:25px}}

/* Lamma adaptive layout v3: iPhone, iPad, landscape, desktop */
:root{color-scheme:dark;--content-max:1180px}
html,body{width:100%;min-height:100%;overflow-x:clip}
body{min-height:100svh;background-color:var(--bg);background-image:radial-gradient(ellipse 75% 55% at 95% 0%,color-mix(in srgb,var(--acc),transparent 89%),transparent),radial-gradient(ellipse 65% 70% at 0% 100%,color-mix(in srgb,var(--bg2),transparent 15%),transparent),linear-gradient(155deg,var(--bg),var(--bg2))}
.wrap{width:min(100%,var(--content-max));max-width:var(--content-max);margin-inline:auto;padding:clamp(16px,2.5vw,36px);padding-top:max(clamp(16px,2.5vw,36px),env(safe-area-inset-top));padding-bottom:max(40px,env(safe-area-inset-bottom))}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,1.8vw,20px)}
.game{min-width:0;min-height:clamp(158px,18vw,205px);padding:clamp(15px,2vw,24px);display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start}
.game span{flex-shrink:0}.game b,.game small{overflow-wrap:anywhere}
.top{margin-bottom:clamp(14px,2vw,25px)}
.panel{width:100%}
.q{min-height:clamp(220px,30vh,390px);padding:clamp(18px,3vw,42px);font-size:clamp(20px,2.6vw,34px)}
.btn{min-height:54px}
input{min-height:55px}
.welcome-hero{max-width:none;width:100%;margin:0 auto 18px}
.welcome-panel{width:100%;max-width:520px}
.welcome-hero .logo{font-size:clamp(76px,10vw,128px)}
.welcome-hero .sub{max-width:480px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.game{min-height:190px}.welcome-hero{padding:38px 28px 30px}.welcome-panel{padding:32px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.game{min-height:205px}.welcome-hero{max-width:800px}.welcome-panel{max-width:540px}.logo{font-size:68px}}
@media(orientation:landscape) and (max-height:650px){.wrap{padding-top:max(10px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}.welcome-hero{padding:12px 18px;margin-bottom:10px}.welcome-mark{height:48px;width:48px;border-radius:16px;margin-bottom:5px}.welcome-mark svg{width:25px;height:25px}.welcome-hero .logo{font-size:clamp(44px,8vh,68px)}.welcome-hero .sub{margin-bottom:8px}.welcome-panel{padding:18px 24px}.panel-heading{margin-bottom:9px}.game{min-height:140px}.q{min-height:160px}}
@media(min-width:700px) and (orientation:landscape) and (max-height:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:359px){.grid{gap:8px}.game{padding:12px;min-height:148px}.game b{font-size:16px}.welcome-panel{padding:17px}}
@media(prefers-contrast:more){.game,.panel,.badge{border-width:2px}.sub,.hint,.game small{opacity:1}}


/* Settings and celebration */
.utility-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.utility-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid #ffffff42;border-radius:13px;background:#ffffff14;color:#fff;padding:9px 12px;font:700 14px Tajawal,Tahoma,sans-serif;cursor:pointer}
.utility-btn svg{width:17px;height:17px}
.utility-btn:focus-visible,.setting-switch:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.lamma-overlay{position:fixed;inset:0;z-index:100;background:#08061bc9;backdrop-filter:blur(14px);display:grid;place-items:center;padding:18px}
.lamma-modal{position:relative;width:min(100%,480px);max-height:calc(100dvh - 36px);overflow-y:auto;border-radius:27px;background:#fbf8f4;color:#2b1a28;padding:26px;box-shadow:0 24px 80px #0009;text-align:right}
.lamma-modal h2{font:800 27px Tajawal,Tahoma,sans-serif;margin:0 0 6px}
.lamma-modal p{color:#6d6472;margin:0 0 20px}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid #e6d9d0}
.setting-row strong,.setting-row small{display:block}
.setting-row small{color:#7a6a76;font-size:12px}
.setting-switch{border:0;border-radius:40px;padding:8px 14px;min-width:70px;background:#ddd4da;color:#342d35;font:800 14px Tajawal,Tahoma,sans-serif;cursor:pointer}
.setting-switch[aria-checked="true"]{background:#18765b;color:white}
.lamma-close{position:absolute;top:15px;left:15px;border:0;background:#f0e8e4;border-radius:12px;width:37px;height:37px;cursor:pointer}
.lamma-close svg{width:18px;height:18px;vertical-align:middle}
.celebrate-modal{text-align:center;background:radial-gradient(circle at 50% 0%,#fff2d6,#fbf8f4 68%)}
.celebrate-crown{display:grid;place-items:center;width:100px;height:100px;margin:18px auto;border-radius:30px;background:linear-gradient(140deg,#ffdf85,#f2b84b);color:#51351b;animation:lamma-pop .65s cubic-bezier(.2,1.7,.4,1) both}
.celebrate-crown svg{width:55px;height:55px}
.celebrate-modal h2{font-size:34px}
.celebrate-modal .btn{margin-top:16px}
@keyframes lamma-pop{from{transform:scale(.3) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@media(prefers-reduced-motion:reduce){.celebrate-crown{animation:none}}


/* Interactive timed bomb game */
.bomb-shell{max-width:750px;margin:0 auto}
.bomb-stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;min-height:340px;padding:22px 18px;border:1px solid #ffffff35;border-radius:30px;background:radial-gradient(circle at 50% 45%,#ffbf572e,transparent 55%),linear-gradient(145deg,#28234b,#14102e);box-shadow:inset 0 1px #ffffff25,0 16px 35px #09061d45}
.bomb-art{position:relative;width:142px;height:155px;display:grid;place-items:end center;animation:bomb-float 1.8s ease-in-out infinite}
.bomb-body{position:relative;display:grid;place-items:center;width:122px;height:122px;border-radius:50%;background:linear-gradient(145deg,#62627a,#171627 65%);border:5px solid #85829c;box-shadow:inset -12px -14px 16px #0007,0 15px 24px #0006}
.bomb-body svg{width:65px;height:65px;color:#ffcf71;stroke-width:1.8}
.bomb-glint{position:absolute;top:15px;right:22px;width:20px;height:9px;border-radius:50%;transform:rotate(-30deg);background:#ffffff45}
.bomb-fuse{position:absolute;top:3px;left:50%;width:7px;height:34px;background:#d3b18c;transform:rotate(-18deg);border-radius:5px}
.bomb-spark{position:absolute;top:-5px;left:45%;width:22px;height:22px;background:#ffd060;border-radius:50%;box-shadow:0 0 12px #ff9d2a,0 0 30px #ff6c00;animation:bomb-spark .45s alternate infinite;z-index:2}
.bomb-status{margin-top:12px;color:#ffce70;font-weight:800;font-size:19px}
.bomb-count{font:800 42px Tajawal,Tahoma,sans-serif;color:white;line-height:1.1;font-variant-numeric:tabular-nums}
.bomb-meter{width:min(100%,420px);height:12px;background:#ffffff20;border-radius:20px;overflow:hidden;margin:12px auto}
.bomb-meter span{display:block;width:100%;height:100%;background:linear-gradient(90deg,#ff914d,#ffdd76);border-radius:20px;transition:width .22s linear}
.bomb-help{color:#f2eaf3;font-size:13px;text-align:center;margin:5px 0 0}
.bomb-challenge{display:grid;gap:5px;margin:13px 0;padding:19px;border-radius:20px;background:var(--card);color:var(--ink);text-align:center;min-height:100px;align-content:center}
.bomb-challenge span{font-size:13px;color:var(--mute)}.bomb-challenge strong{font-size:clamp(18px,2.6vw,25px);line-height:1.5}
.bomb-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bomb-controls .btn{margin:0}.bomb-stats{margin-top:12px;text-align:center;color:#ffffffb5;font-size:13px}
.bomb-danger{border-color:#ff5353;background:radial-gradient(circle,#c7353540,transparent 60%),#261124}.bomb-danger .bomb-art{animation:bomb-shake .13s linear infinite}.bomb-danger .bomb-meter span{background:#ff5151}
.bomb-exploded{background:radial-gradient(circle,#ffb42d55,transparent 70%),#392239}.bomb-exploded .bomb-art{animation:bomb-pop .5s ease-out both}
@keyframes bomb-float{50%{transform:translateY(-8px)}}@keyframes bomb-spark{to{transform:scale(.65);opacity:.55}}@keyframes bomb-shake{25%{transform:translateX(5px) rotate(3deg)}75%{transform:translateX(-5px) rotate(-3deg)}}@keyframes bomb-pop{50%{transform:scale(1.2)}to{transform:scale(.88);opacity:.5}}
@media(max-width:420px){.bomb-stage{min-height:310px}.bomb-controls{grid-template-columns:1fr}}
@media(orientation:landscape) and (max-height:600px){.bomb-stage{min-height:230px}.bomb-art{transform:scale(.7);height:115px}.bomb-help{display:none}}
@media(prefers-reduced-motion:reduce){.bomb-art,.bomb-spark,.bomb-danger .bomb-art,.bomb-exploded .bomb-art{animation:none}}

/* Group modes, themes, and tournament */
.lamma-game-toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0 18px}
.lamma-game-toolbar .utility-btn{flex:1;justify-content:center;min-width:120px}
.lamma-board{display:grid;gap:8px}.lamma-board-row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px;border:1px solid #e8dce3;border-radius:13px;flex-wrap:wrap}.lamma-board-row span{font-size:13px;color:#6f6371}
.lamma-theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.lamma-theme-choice{padding:20px 10px;border:2px solid #e4d6db;border-radius:15px;font:700 16px Tajawal,Tahoma,sans-serif;cursor:pointer;background:#eee}.lamma-theme-choice.selected{border-color:#d89b2d;box-shadow:0 0 0 3px #e8b65e44}
.lamma-theme-choice[data-theme-choice=royal]{background:#292044;color:#fbd48b}.lamma-theme-choice[data-theme-choice=gold]{background:#46301c;color:#ffe6a3}.lamma-theme-choice[data-theme-choice=night]{background:#101827;color:#d8edff}.lamma-theme-choice[data-theme-choice=day]{background:#f4f0e8;color:#34283b}

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const norm=c=>c.toUpperCase().replace(/[^A-Z0-9]/g,"");
async function deriveKey(code){const m=await crypto.subtle.importKey("raw",enc.encode(norm(code)),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:enc.encode("lamma-v1"),iterations:150000,hash:"SHA-256"},m,{name:"AES-GCM",length:256},false,["decrypt"])}
async function open(blob,key){const d=b64(blob);return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:d.slice(0,12)},key,d.slice(12))))}
async function unlock(code){
 const key=await deriveKey(code);
 for(const w of V.w){let m;try{m=await open(w,key)}catch(e){continue}
  if(m.e&&Date.now()>Date.parse(m.e+"T23:59:59"))return{err:"انتهى اشتراك هذا الكود. تواصل مع البائع للتجديد."};
  const k=await crypto.subtle.importKey("raw",b64(m.k),"AES-GCM",false,["decrypt"]);
  return{pkg:await open(V.c[m.p],k),meta:m}}
 return{err:"الكود غير صحيح، تأكد من كتابته."}
}

  $("#bomb-meter").style.width=pct+"%";
  $("#bomb-stage").classList.toggle("bomb-danger",pct<28);
  $("#bomb-count").textContent=Math.ceil(remain/1000);
  if(remain<=0){explode();return}
 };
 const explode=()=>{
  if(!running)return;
  running=false;done=true;clearInterval(interval);interval=null;
  $("#bomb-stage").classList.remove("bomb-danger");$("#bomb-stage").classList.add("bomb-exploded");
  $("#bomb-count").textContent="!";
  $("#bomb-status").textContent="انفجرت القنبلة!";
  $("#bomb-help").textContent="انتهى الوقت! استعدوا للجولة التالية.";
  const loser=who();lammaRecordLoss(loser);$("#bomb-question").textContent="انفجرت عند "+loser+"! "+nextChallenge();
  $("#tn").textContent="نهاية الجولة "+(round+1);
  $("#st").textContent="جولة جديدة";$("#bomb-skip").disabled=true;$("#bomb-level").disabled=false;
  beep(130,.4);vib([160,80,160]);fx(140);round++;turn++;
 };
 const action=()=>{
  if(!running){
   running=true;done=false;seconds=lammaDifficulty();end=performance.now()+seconds*1000;
   $("#bomb-stage").classList.remove("bomb-exploded","bomb-danger");
   $("#bomb-status").textContent="القنبلة تعمل!";
   $("#bomb-question").textContent=nextChallenge();
   $("#bomb-help").textContent="جاوب بسرعة ثم اضغط «مرّر»!";
   $("#st").textContent="مرّر إلى التالي";$("#bomb-skip").disabled=false;
   $("#tn").textContent="القنبلة مع: "+who();
   $("#bomb-stats").textContent="الجولة "+(round+1)+" · الوقت بدأ!";$("#bomb-level").disabled=true;
   $("#bomb-count").textContent=seconds;$("#bomb-meter").style.width="100%";
   beep(820,.12);vib(40);
   interval=setInterval(()=>{update();if(running&&Math.ceil(Math.max(0,end-performance.now())/1000)<=5)beep(630,.035)},220);
   TM.push(interval);update();
  }else{
   turn++;$("#tn").textContent="القنبلة مع: "+who();
   $("#bomb-question").textContent=nextChallenge();
   $("#bomb-status").textContent="لا توقفون!";
   beep(760,.07);vib(35);update();
  }
 };
 render();
},
timer(g){let d=sh(g.i);
 const n=()=>{if(!d.length)d=sh(g.i);const c=d.pop();
  scr(g.n,`<div class="turn">الدور على: ${esc(who())}</div><div class="panel q"><i>⏱️</i><div>اذكر أكبر عدد من:<br><b>${c}</b></div><div class="big" id="cd">30</div></div><div class="bar"><i id="br" style="width:100%"></i></div><button class="btn" id="go">ابدأ العدّ</button>`);
  $("#go").onclick=()=>{let s=30;const b=$("#go");b.disabled=true;setTimeout(()=>$("#br").style.width="0%",50);
   const k=setInterval(()=>{s--;$("#cd").textContent=s;if(s<=5&&s>0)beep(700,.05);
    if(s<=0){clearInterval(k);vib(300);beep(200,.6);fx(90);b.disabled=false;b.textContent="فئة جديدة ➜";b.onclick=()=>{turn++;n()}}},1000);TM.push(k)}};
 n()}
};
(async()=>{const c=ls.get("code");if(c){const r=await unlock(c);if(r.pkg)return enter(r,true)}gate()})();
